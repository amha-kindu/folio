[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
addopts =
    -ra
    --strict-markers
    --disable-warnings
    --cov=accounts
    --cov=catalog
    --cov=dashboard
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
